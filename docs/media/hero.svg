<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Astrobender — an interactive 3D observatory for the Solar System and Earth orbit">
<style>
.bg{animation:bg 12s linear infinite}
@keyframes bg{0%,8%{fill:#e8edf7}28%{fill:#3a3f8f}48%,80%{fill:#070b1d}90%,100%{fill:#e8edf7}}
.ink{animation:ink 12s linear infinite}
@keyframes ink{0%,8%{fill:#18203f}28%{fill:#f2f4ff}48%,80%{fill:#e7ebff}90%,100%{fill:#18203f}}
.rule{animation:rule 12s linear infinite}
@keyframes rule{0%,8%{stroke:#18203f33}28%{stroke:#f2f4ff33}48%,80%{stroke:#e7ebff33}90%,100%{stroke:#18203f33}}
.panel{animation:panel 12s linear infinite}
@keyframes panel{0%,8%{fill:#18203f12}28%{fill:#f2f4ff12}48%,80%{fill:#e7ebff12}90%,100%{fill:#18203f12}}
.muted{opacity:.72}
.stars{animation:stars 12s linear infinite}
@keyframes stars{0%,8%{opacity:0}28%{opacity:.25}48%,80%{opacity:.9}90%,100%{opacity:0}}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}
.lit{filter:drop-shadow(0 0 4px currentColor)}
.pulse{animation:pulse 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes spin{0%{transform:scaleX(1)}50%{transform:scaleX(0)}100%{transform:scaleX(-1)}}
@keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(3.2);opacity:0}}
@keyframes dash{to{stroke-dashoffset:-20}}
@keyframes grow{0%{transform:scaleY(.08)}35%,80%{transform:scaleY(1)}100%{transform:scaleY(.08)}}
@keyframes draw{0%{stroke-dashoffset:700}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-700}}
@keyframes blink{50%{opacity:0}}
@keyframes feed{0%{transform:translateY(150px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes slide{to{transform:translateX(100px)}}
@keyframes eq{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
@keyframes drop{0%,6%{transform:scaleY(0);opacity:0}16%,88%{transform:scaleY(1);opacity:1}96%,100%{transform:scaleY(0);opacity:0}}
@keyframes gauge{0%,10%{stroke-dashoffset:390}40%,85%{stroke-dashoffset:110}100%{stroke-dashoffset:390}}
@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes sweep{0%{transform:skewX(-18deg) translateX(0)}60%,100%{transform:skewX(-18deg) translateX(788px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect class="bg" width="1200" height="440" rx="28" fill="#e8edf7"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" letter-spacing="2.4"><text class="ink muted" x="64" y="104">OBSERVATORY · THREE.JS + SGP4 · TR / EN</text></g>
<text class="ink" x="60" y="236" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-style="italic" font-size="78" letter-spacing="-1">Astrobender.</text>
<text class="ink muted" x="64" y="300" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="20">The Solar System and every tracked satellite, in one scene.</text>
<line class="rule" x1="64" y1="372" x2="1136" y2="372"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="1.8">
  <text class="ink muted" x="64" y="404">JPL ORBITS · CELESTRAK GP</text>
  <text class="ink muted" x="600" y="404" text-anchor="middle">88 CONSTELLATIONS · LIVE SKY</text>
  <text class="ink muted" x="1136" y="404" text-anchor="end">NO ACCOUNT · RUNS IN THE BROWSER</text>
</g>
<rect class="panel rule" x="652" y="92" width="488" height="262" rx="24"/>
<g class="stars"><circle cx="1008.2" cy="171.2" r="1.9" fill="#fff" style="animation:tw 2s ease-in-out 1.8s infinite"/><circle cx="906.8" cy="321.9" r="1.2" fill="#fff" style="animation:tw 4s ease-in-out 0.1s infinite"/><circle cx="687.1" cy="226.3" r="1.3" fill="#fff" style="animation:tw 2.8s ease-in-out 1.7s infinite"/><circle cx="800.6" cy="152.2" r="0.7" fill="#fff" style="animation:tw 1.8s ease-in-out 0.7s infinite"/><circle cx="995.4" cy="140.2" r="1.7" fill="#fff" style="animation:tw 2.8s ease-in-out 0.1s infinite"/><circle cx="904.1" cy="179.9" r="0.7" fill="#fff" style="animation:tw 4s ease-in-out 0.2s infinite"/><circle cx="803.9" cy="163.4" r="1.2" fill="#fff" style="animation:tw 1.7s ease-in-out 1.1s infinite"/><circle cx="836.5" cy="174.6" r="1.2" fill="#fff" style="animation:tw 2.8s ease-in-out 1.3s infinite"/><circle cx="846.2" cy="201.3" r="1.6" fill="#fff" style="animation:tw 2.8s ease-in-out 2s infinite"/><circle cx="970.1" cy="312.9" r="0.9" fill="#fff" style="animation:tw 2.8s ease-in-out 1.1s infinite"/><circle cx="982.1" cy="139.9" r="1.6" fill="#fff" style="animation:tw 3.2s ease-in-out 1.7s infinite"/><circle cx="826.9" cy="138.6" r="1.3" fill="#fff" style="animation:tw 3.1s ease-in-out 0.6s infinite"/><circle cx="705.8" cy="191.1" r="1" fill="#fff" style="animation:tw 2.3s ease-in-out 0.3s infinite"/><circle cx="896.9" cy="316.1" r="1.4" fill="#fff" style="animation:tw 3.8s ease-in-out 0.1s infinite"/><circle cx="1053.9" cy="205.6" r="1.8" fill="#fff" style="animation:tw 1.9s ease-in-out 1.9s infinite"/><circle cx="721.1" cy="205.8" r="1.5" fill="#fff" style="animation:tw 3.8s ease-in-out 1.4s infinite"/><circle cx="802.4" cy="141.1" r="1.9" fill="#fff" style="animation:tw 1.7s ease-in-out 0s infinite"/><circle cx="781.2" cy="200.5" r="1.3" fill="#fff" style="animation:tw 3.6s ease-in-out 1.2s infinite"/><circle cx="708.2" cy="134.6" r="1.6" fill="#fff" style="animation:tw 2.1s ease-in-out 0s infinite"/><circle cx="667.1" cy="296.1" r="1.7" fill="#fff" style="animation:tw 3.9s ease-in-out 0.5s infinite"/><circle cx="690.6" cy="239.4" r="1.6" fill="#fff" style="animation:tw 2.4s ease-in-out 1.1s infinite"/><circle cx="870.9" cy="157.4" r="0.9" fill="#fff" style="animation:tw 3.3s ease-in-out 0.5s infinite"/><circle cx="923.3" cy="251" r="1.5" fill="#fff" style="animation:tw 3.7s ease-in-out 0.7s infinite"/><circle cx="721.8" cy="302" r="1.2" fill="#fff" style="animation:tw 3.9s ease-in-out 1.9s infinite"/><circle cx="885.3" cy="328.2" r="1.9" fill="#fff" style="animation:tw 2.9s ease-in-out 0.8s infinite"/><circle cx="1069.3" cy="277.8" r="1.8" fill="#fff" style="animation:tw 2s ease-in-out 0.4s infinite"/></g>
<defs><radialGradient id="pl" cx=".35" cy=".35" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".25" stop-color="#ffb347"/><stop offset="1" stop-color="#b28dff"/></radialGradient></defs>
<circle cx="896" cy="223" r="58" fill="#ffb347" fill-opacity=".18" class="pulse"/>
<circle cx="896" cy="223" r="40" fill="url(#pl)"/>
<ellipse cx="896" cy="223" rx="62" ry="10" fill="none" stroke="#6ec3ff" stroke-width="3" stroke-opacity=".7" transform="rotate(-14 896 223)"/><g transform="rotate(-12 896 223)"><ellipse cx="896" cy="223" rx="200" ry="64" fill="none" stroke="#ffb347" stroke-opacity=".45" stroke-dasharray="2 5"/>
<circle r="6" fill="#ffb347" class="lit" style="color:#ffb347"><animateMotion dur="9s" repeatCount="indefinite" path="M 1096 223 A 200 64 0 1 1 696 223 A 200 64 0 1 1 1096 223"/></circle></g><g transform="rotate(18 896 223)"><ellipse cx="896" cy="223" rx="150" ry="46" fill="none" stroke="#6ec3ff" stroke-opacity=".45" stroke-dasharray="2 5"/>
<circle r="5" fill="#6ec3ff" class="lit" style="color:#6ec3ff"><animateMotion dur="6s" repeatCount="indefinite" path="M 1046 223 A 150 46 0 1 1 746 223 A 150 46 0 1 1 1046 223"/></circle></g><g transform="rotate(-4 896 223)"><ellipse cx="896" cy="223" rx="100" ry="30" fill="none" stroke="#b28dff" stroke-opacity=".45" stroke-dasharray="2 5"/>
<circle r="4" fill="#b28dff" class="lit" style="color:#b28dff"><animateMotion dur="4.5s" repeatCount="indefinite" path="M 996 223 A 100 30 0 1 1 796 223 A 100 30 0 1 1 996 223"/></circle></g>
</svg>
